name: Build apps

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (instalador y portable)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      # Evita el error de symlinks al extraer winCodeSign en Windows.
      # Si esta descarga falla, electron-builder lo intenta por su cuenta.
      - name: Preparar caché winCodeSign
        continue-on-error: true
        shell: pwsh
        run: |
          $cache = "$env:LOCALAPPDATA\electron-builder\Cache\winCodeSign\winCodeSign-2.6.0"
          if (-not (Test-Path "$cache\rcedit-x64.exe")) {
            New-Item -ItemType Directory -Force -Path $cache | Out-Null
            $7z = Join-Path $PWD "node_modules\7zip-bin\win\x64\7za.exe"
            $tmp = Join-Path $env:TEMP "winCodeSign-2.6.0.7z"
            Invoke-WebRequest -Uri "https://github.com/electron-userland/electron-builder-binaries/releases/download/winCodeSign-2.6.0/winCodeSign-2.6.0.7z" -OutFile $tmp
            & $7z x -bd -y $tmp "-o$cache" | Out-Null
          }
          $global:LASTEXITCODE = 0
          exit 0

      - name: Compilar instalador y portable
        run: npm run electron:dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Listar resultado
        shell: pwsh
        run: Get-ChildItem dist-electron -Filter *.exe | Select-Object Name, Length

      - name: Subir ejecutables de Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-instalador-y-portable
          path: dist-electron/*.exe
          if-no-files-found: error

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Aceptar licencias de Android SDK
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Crear proyecto Android limpio
        run: |
          rm -rf android
          npx cap add android

      - name: Generar iconos de Android (opcional)
        continue-on-error: true
        run: npx capacitor-assets generate --android

      - name: Sincronizar web con Android
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Preparar APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/Simulador-Enfermeria-Chile.apk

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/Simulador-Enfermeria-Chile.apk
          if-no-files-found: error

  release:
    name: Publicar release con APK y EXE
    needs: [windows, android]
    if: ${{ !cancelled() && needs.windows.result == 'success' && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Listar archivos
        run: ls -la artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: artifacts/*
